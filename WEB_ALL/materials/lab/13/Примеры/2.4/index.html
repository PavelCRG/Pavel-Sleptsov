<!DOCTYPE html>
<html>

<head>
    <title>Вывод реального времени</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
</head>

<body>
    <script>
        now = new Date()
        document.write("Time:" + now.getHours() + ":" + now.getMinutes() + "<br>")
        document.write("Date:" + (now.getMonth() + 1) + "/" + now.getDate() + "/" + now.getFullYear())
    </script>
</body>

</html>
