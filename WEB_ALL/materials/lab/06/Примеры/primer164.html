<!DOCTYPE html>
<html lang="ru">
<head>
    <title>блочная верстка</title>
    <style type='text/css'>
        
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            background: #f4f4f4;
            padding: 20px;
        }

        #container {
            margin: 0 auto;
            width: 900px; 
            background: #fff;
            padding: 10px;
        }

        #header {
            border: 3px solid orange;
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
            padding: 20px 0;
            text-align: center;
        }

        #sidebar {
            border: 3px solid red;
            float: left;
            width: 20%;
            margin-right: 5%;
            min-height: 300px;
            padding: 15px;
        }

        #content {
            border: 3px solid green;
            float: left;
            width: 75%; /* 100% - 20% - 5% margin */
            min-height: 300px;
            padding: 15px;
        }

        #footer {
            border: 3px solid aqua;
            width: 100%;
            height: 50px;
            margin-top: 10px;
            padding: 10px 0;
            text-align: center;
            clear: both; 
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header"> header (шапка сайта) </div>
        <div id="sidebar"> левая панель </div>
        <div id="content"> основной контент </div>
        <div id="footer"> footer (подвал) </div>
    </div>
</body>
</html>
