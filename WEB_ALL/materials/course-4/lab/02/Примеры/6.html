<!DOCTYPE html>
<html lang="ru">
<body>
<form name="forma">
Первое число <input type="text" name="num1"><br><br>
Второе число <input type="text" name="num2"><br><br>
<button type="button" onclick="func1()">Вычислить сумму</button>
Сумма <input type="text" name="sum" readonly>
</form>
<br>
<button type="button" onclick="func1()">Вычислить сумму(индекс)</button>
<button type="button" onclick="func2()">Вычислить сумму(имя)</button>
<script>
function func1(){
var f = document.forms[0];
f.elements[3].value = Number(f.elements[0].value)+Number(f.elements[1].value);
}
function func2() {
var f = document.forma;
f.sum.value = Number(f.num1.value)+Number(f.num2.value);
}
</script>
</body>
</html>
