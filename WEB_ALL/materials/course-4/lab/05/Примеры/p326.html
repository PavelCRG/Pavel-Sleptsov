<!DOCTYPE TYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница 326: Свойства DOM</title>
</head>
<body>

    <!-- Кнопка с уникальным id -->
    <input type="button" id="elem" value="Нажми меня">

    <script>
        // Находим элемент кнопки по его id
        let elem = document.getElementById('elem');

        // Функция f1 меняет цвет текста элемента на лаймовый
        function f1(obj) {
            obj.style.color = "lime";
        }

        // Функция f2 вызывает модальное окно с уведомлением
        function f2() {
            alert('Событие произошло!');
        }

        // Правильный современный способ назначить ОБА обработчика (и f1, и f2)
        // Чтобы они не перезаписывали друг друга, используем addEventListener
        elem.addEventListener('click', function() {
            f1(elem); // передаем саму кнопку внутрь функции f1
        });

        elem.addEventListener('click', f2);
    </script>

</body>
</html>
