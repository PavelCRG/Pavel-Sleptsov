<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 30. Перетаскивание контейнеров</title>
    <script>
        var ob;

        function dn(e) {
            e = e || event;
            ob = e.target || e.srcElement; // Определяется объект под курсором
            
            // Команда из Примера 30: если кликнули по картинке внутри div, перетаскиваем сам div
            if (ob.parentNode.tagName == 'DIV') ob = ob.parentNode;
            
            document.onmousemove = mv;     
            document.onmouseup = up;       
            return false;                  
        }

        function mv(e) {
            e = e || event;
            if (ob) { 
                ob.style.left = e.clientX - 50 + 'px'; 
                ob.style.top = e.clientY - 50 + 'px';  
            }
            return false;
        }

        function up() {
            ob = null;                    
            document.onmousemove = null;  
            document.onmouseup = null;    
        }
    </script>
</head>
<body style="background:brown;" ondragstart="return false" onselectstart="return false" onmousedown="dn(event)">

    <p style="width:100px; position:absolute; top:100px; left:500px; font-family: Arial; color:white;">Перетаскивай!!!</p>

    <!-- Зеленый прямоугольник со свойствами из Примера 30 (width:350px; height:200px; top:150px;) -->
    <div style="position:absolute; top:150px; left:450px; width:350px; height:200px; background-color:green;">
        
        <!-- Первая картинка внутри контейнера -->
        <img src="image/banan.png" style="height:150px; position:absolute; top:10px; left:10px;" alt="Картинка 1">

        <!-- Вторая картинка внутри контейнера -->
        <img src="image/lemon.png" style="height:150px; position:absolute; top:10px; left:180px;" alt="Картинка 2">

    </div>

</body>
</html>
