<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление элементов (append)</title>
</head>
<body>
    <script>
        constheader = document.createElement("h1");
        const headerText = document.createTextNode("Hello World");
        constheader.appendChild(headerText);
        document.body.appendChild(constheader);
    </script>
</body>
</html>
