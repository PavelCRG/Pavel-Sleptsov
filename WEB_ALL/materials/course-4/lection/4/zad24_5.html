<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 5</title>
    <script>
        var n = 0; 
        // 6 состояний: исходный (150px) + 5 шагов увеличения до 300px
        var NN = ["150px", "180px", "210px", "240px", "270px", "300px"]; 

        function func2() {
            n = (n + 1) % 6; // Циклическое изменение индекса от 0 до 5
            document.getElementById("rr1").style.height = NN[n];
        }
    </script>
</head>
<body style="background-color: blue; text-align: center;">
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
</body>
</html>
