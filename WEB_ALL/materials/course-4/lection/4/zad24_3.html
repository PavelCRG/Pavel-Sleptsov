<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3 - Контроль</title>
    <script>
        var n = 0;
        // Массив из трех картинок
        var pic = ["image/sun.png", "image/moon.png", "image/cloud.png"]; 

        function func2() {
            n = (n + 1) % 3; // Теперь цикл идет по кругу: 0 -> 1 -> 2 -> 0...
            document.getElementById("rr1").src = pic[n];
        }
    </script>
</head>
<body style="background-color: blue;">
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
    <p style="color:yellow"></p>
</body>
</html>
