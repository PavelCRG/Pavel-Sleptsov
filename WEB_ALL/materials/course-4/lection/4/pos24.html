<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 24</title>
    <script>
        var n = 0; // номер отображаемого состояния размера
        // Массив со значениями высоты картинки (исходная и увеличенная вдвое)
        var NN = ["150px", "300px"]; 

        function func2() {
            n = (n + 1) % 2; // циклическое изменение n между 0 и 1
            // Меняем стилевое свойство height вместо источника src
            document.getElementById("rr1").style.height = NN[n];
        }
    </script>
</head>

<body style="background-color: blue;">
    <!-- Картинка всегда остается солнцем, но меняет размер по клику -->
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
    
    <p style="color:yellow"></p>
</body>

</html>
