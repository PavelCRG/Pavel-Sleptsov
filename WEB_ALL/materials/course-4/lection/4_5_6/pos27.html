<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 26
        
    </title>
    <script>
        var col, ob;
        
        function fover(e) {
            e = e || event;
            ob = e.target || e.srcElement;
            if (ob.type == "button") {
                col = ob.style.backgroundColor;
                ob.style.backgroundColor = "yellow";
                ob.style.color = "red";
            }
        } 

        function fout(e) {
            e = e || event;
            ob = e.target || e.srcElement;
            if (ob.type == "button") {
                ob.style.backgroundColor = col;
                ob.style.color = "black";
            }
        }   
    </script>
</head>

<body style="background: brown; padding: 20px; font-family: Arial; color: white;">

    <p style="text-align: center;">Попробуйте поводить мышкой по разным элементам страницы и смотрите на её заголовок (вкладку)!</p>
    <div style="text-align: center; margin-top: 20px;">
        <img src="image/moon.png" style="height: 150px;" alt="Тестовая картинка">
    </div>
    <div style="text-align: center; margin-top: 20px;">
        <form onmouseover="fover(event)" onmouseout="fout(event)">
            <input type="button" value="Тестовая кнопка" style="padding: 10px 20px;">
        </form>
    </div>

</body>

</html>
