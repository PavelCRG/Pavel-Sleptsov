<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 16</title>
    <script>
        function func1() {
            alert(document.body.childNodes.length);
        };

        function func2() {
            alert(document.forms.length);
        };


        function func3() {
            alert(document.forms[0].elements.length);
        };
    </script>

</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками (Пример 16)</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
