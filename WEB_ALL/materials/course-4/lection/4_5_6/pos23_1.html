<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 23/1</title>
    <script>
        // Глобальная переменная-флаг
        var flag = true;

        function func2() {
            flag = !flag; // меняем значение флага на противоположное
            
            if (flag) {
                document.getElementById("rr1").src = "image/moon.png";
            } else {
                document.getElementById("rr1").src = "image/sun.png";
            }
        }
    </script>
</head>

<body style="background-color: blue;">
    <!-- Форма с кнопками удалена. Клик повешен на картинку -->
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
    
    <p style="color:yellow"></p>
</body>

</html>
