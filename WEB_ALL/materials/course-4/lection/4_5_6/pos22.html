<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 22</title>
</head>

<body style="background-color: blue;">
    <!-- Вставлен тег изображения выше абзаца -->
    <img id="rr1" src="image/sun.png" style="height:150px">
    
    <!-- Содержимое текстового контейнера удалено -->
    <p style="color:yellow"></p>
    
    <form>
        <!-- Изменены команды при нажатии на кнопки, третья кнопка удалена -->
        <input type="button" value="Первая" onclick="document.getElementById('rr1').src = 'image/sun.png';">
        <input type="button" value="Вторая" onclick="document.getElementById('rr1').src = 'image/moon.png';">
    </form>
</body>

</html>
