<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1</title>
    <script>
        function func1() {
            alert('Вы нажали первую кнопку');
        }

        function func2() {
            document.writeln("appName: " + navigator.appName + "<BR>");
            document.writeln("appVersion: " + navigator.appVersion + "<BR>");
            document.writeln("userAgent: " + navigator.userAgent + "<BR>");
        }

        function func3() {
            alert('Вы нажали третью кнопку');
        }
    </script>
</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
