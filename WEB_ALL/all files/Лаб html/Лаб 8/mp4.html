<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lab 8: Slide from Button</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      gap: 60px;
      padding-top: 100px;
      background-color: #f5f5f5;
      margin: 0;
    }

    .frame {
      position: relative;
      text-align: center;
      width: 220px;
    }

    /* Кнопка-триггер */
    .frame h3 {
      padding: 12px 30px;
      background: #ffffff;
      border: 1px solid #cccccc;
      cursor: pointer;
      margin: 0;
      font-size: 18px;
      font-weight: bold;
      transition: background-color 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    .frame h3:hover {
      background-color: #e0e0e0;
    }

    
    .img {
      width: 100%;
      height: 0;           
      overflow: hidden;    
      
     
      transition: height 0.6s ease-in-out; 
      
      background-color: #fff;
      border: 1px solid #ddd;
      border-top: none;    
      box-sizing: border-box;
    }

    .img img {
      width: 100%;
      height: 100%;
      object-fit: cover;   
      display: block;
    }

    
    .frame h3:hover + .img {
      height: 220px; 
    }
  </style>
</head>
<body>

  <!-- Блок 1 -->
  <div class="frame">
    <h3>Rabbit</h3>
    <div class="img">
      <img src="rabbit400-01.jpg" alt="Rabit">
    </div>
  </div>

  <!-- Блок 2 -->
  <div class="frame">
    <h3>Rabir</h3>
    <div class="img">
      <img src="rabbit400-02.jpg" alt="Rabir">
    </div>
  </div>

</body>
</html>
