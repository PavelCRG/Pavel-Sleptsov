<!DOCTYPE html>
<html>

<head>
    <title>Перемещение</title>
    <script type="text/javascript">
        var stop = 100
        var n // номер кадра, в который вставляется изображение 
        var d = document

        // Предварительная загрузка изображений из вашей папки image
        imgempty = new Image()
        imgempty.src = "image/7_l.jpg"
        imganim = new Image()
        imganim.src = "image/P.jpg"

        // функция, осуществляющая анимацию перемещения 
        function anim1() {
            var len = d.images.length
            if (n != stop) {
                n = n + 1
                if (n > len) {
                    n = 1;
                    d.images[n - 1].src = imganim.src
                    d.images[len - 1].src = imgempty.src
                }
                else {
                    d.images[n - 2].src = imgempty.src
                    d.images[n - 1].src = imganim.src
                }
                setTimeout("anim1()", 500)
            }
        }

        // ИСПРАВЛЕНО: функция для задания начальной позиции (разделено пробелом)
        function st() {
            d.images[0].src = imganim.src
            for (var i = 1; i <= d.images.length - 1; i++)
                d.images[i].src = imgempty.src
        } 
    </script>
</head>

<body>
    <h4 align="left">Простая анимация</h4>
    <hr>
    <!-- 8 кадров на странице: первый с вашей картинкой, остальные пустые -->
    <img src="image/P.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <img src="image/7_l.jpg">
    <hr>
    <form name="form1">
        <input type="button" value="Начало" onClick="n = stop; st()">
        <input type="button" value="Запустить" onClick="n=1; anim1()">
    </form>
</body>

</html>
