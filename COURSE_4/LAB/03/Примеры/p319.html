<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальные методы</title>
    <script type="text/javascript">
        function f1() {
            let allDiv = document.getElementsByTagName('div');
            for (let i = 0; i < allDiv.length; i++) {
                allDiv[i].removeAttribute('style');
            }
            if (allDiv[2]) {
                allDiv[2].innerText = "Общие свойства и методы";
            }
            let inputBtn = document.getElementsByTagName('input')[0];
            if (inputBtn) {
                inputBtn.setAttribute('value', 'Уже изменили');
            }
        }
    </script>
</head>
<body>
    <div style="color: aqua;">Универсальные</div>
    <div style="color: lime;">Свойства и Методы</div>
    <div style="color: magenta;">Поддерживаются всеми элементами</div>
    <input type="button" onClick="f1();" value="Изменить" style="float: right;">
</body>
</html>
