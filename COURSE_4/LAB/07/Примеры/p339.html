<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Страница 339 - Fieldset</title>
</head>

<body>
    <form>
        <fieldset>
            <legend align="right">ООО</legend>
            <label>Моя специальность: </label><input placeholder="2-40 01 01">
            <label>Название специальности: </label><input required>
        </fieldset>
        <input type="button" value="Изменить" onclick="f1()">
    </form>

    <script>
        function f1() {
            alert(document.forms[0].elements[0].type);
            alert(document.forms[0].elements[1].outerHTML);
            document.getElementsByTagName('legend')[0].innerText = "Среднее специальное образование";
        }
    </script>
</body>

</html>
