<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1. Ограничение тегов</title>
    <script>
        var ob;

        function dn(e) {
            e = e || event;
            ob = e.target || e.srcElement;
            document.onmousemove = mv;
            document.onmouseup = up;
            return false;
        }

        function mv(e) {
            e = e || event;
            if (ob) {
                ob.style.left = e.clientX - 50 + 'px';
                ob.style.top = e.clientY - 50 + 'px';
            }
            return false;
        }

        function up() {
            ob = null;
            document.onmousemove = null;
            document.onmouseup = null;
        }
    </script>
</head>
<!-- Из body удален onmousedown -->
<body style="background:brown;" ondragstart="return false" onselectstart="return false">

    <!-- ТЕКСТ (БЕЗ onmousedown — НЕ перетаскивается) -->
    <p style="width:100px; position:absolute; top:100px; left:500px; font-family: Arial; color:white;">Перетаскивай!!!</p>

    <!-- КАРТИНКА 1 (С onmousedown — перетаскивается) -->
    <img src="image/banan.png" onmousedown="dn(event)" style="height:150px; position:absolute; top:200px; left:200px;" alt="Картинка 1">

    <!-- КАРТИНКА 2 (С onmousedown — перетаскивается) -->
    <img src="image/lemon.png" onmousedown="dn(event)" style="height:150px; position:absolute; top:30px; left:30px;" alt="Картинка 2">

    <!-- ПРЯМОУГОЛЬНИК (С onmousedown — перетаскивается) -->
    <div onmousedown="dn(event)" style="position:absolute; top:350px; left:450px; width:280px; height:70px; background-color:green;"></div>

</body>
</html>
