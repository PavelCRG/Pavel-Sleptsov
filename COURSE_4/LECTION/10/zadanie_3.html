<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 3 - Идентификационный номер РБ</title>
    <script>
        function func1() {
            document.getElementById("t1").value = "";
        }

        function func2() {
            var str = document.getElementById("t1").value;
            var reg = /^[34]\d{6}[ABEIKMHOPCTXАВЕІКМНОРСКТХ]\d{3}[ABEIKMHOPCTXАВЕІКМНОРСКТХ]{2}\d$/;

            if (reg.test(str)) {
                alert("Верно");
            } else {
                alert("Неверно");
            }
        }
    </script>
</head>

<body style="background-color: green;">
    <p style="color: yellow;">Проверка идентификационного номера РБ (поддержка латиницы и кириллицы)</p>
    <form>
        <input id="t1" type="text" size="40" value=""><br><br>
        <input style="background-color: pink;" type="button" value="Очистить" onclick="func1()">
        <input style="background-color: lightgreen;" type="button" value="Проверить" onclick="func2()">
    </form>
</body>

</html>
