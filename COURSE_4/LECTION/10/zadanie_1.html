<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Задание 1 - Номер паспорта РБ</title>
    <script>
        function func1() {
            document.getElementById("t1").value = "";
        }

        function func2() {
            var str = document.getElementById("t1").value;
            var reg = /^[A-Z]{2}\d{7}$/;

            if (reg.test(str)) {
                alert("Верно");
            } else {
                alert("Неверно");
            }
        }
    </script>
</head>

<body style="background-color: green;">
    <p style="color: yellow;">Проверка номера паспорта РБ (например, AB1234567)</p>
    <form>
        <input id="t1" type="text" size="30" value=""><br><br>
        <input style="background-color: pink;" type="button" value="Очистить" onclick="func1()">
        <input style="background-color: lightgreen;" type="button" value="Проверить" onclick="func2()">
    </form>
</body>

</html>
