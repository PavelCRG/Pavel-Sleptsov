<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример 11</title>
    <script>
        function func1() { 
            alert(document.title); 
        }
        
        function func2() { 
            alert(document.URL); 
        }
        
        function func3() { 
            // alert('Вы нажали третью кнопку');
            document.title = "Новый заголовок";
        }
    </script>
</head>
<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками (Пример 11)</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>
</html>
