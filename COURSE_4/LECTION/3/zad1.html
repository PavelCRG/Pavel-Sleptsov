<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function func1() {
            m = prompt('Введите свое имя', '');
            alert(m)
        };
        function func2() {
            n = confirm('Нажмите на любую кнпоку');
            alert(n)
        };
        function func3() { alert('Вы нажали третью кнопку') };
    </script>

</head>

<body style="background-color: green;">
    <p style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
