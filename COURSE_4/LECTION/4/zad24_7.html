<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 7</title>
    <script>
        var n = 0; 
        var direction = 1; // 1 — увеличивать, -1 — уменьшать
        var NN = ["150px", "180px", "210px", "240px", "270px", "300px"]; 

        function func2() {
            n += direction;
            document.getElementById("rr1").style.height = NN[n];

            // Разворот направления движения при достижении краев
            if (n === 5) direction = -1;
            if (n === 0) direction = 1;
        }
    </script>
</head>
<body style="background-color: blue; text-align: center;">
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
</body>
</html>
