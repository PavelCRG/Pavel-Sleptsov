<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 21</title>
    <script>
        function func1() {
            document.getElementById("tp1").style.backgroundColor = "pink";
            document.getElementById("tp1").style.color = "blue";
            document.getElementById("tp1").innerHTML = "Вы нажали на первую кнопку";
        }
        function func2() {
            document.getElementById("tp1").style.backgroundColor = "lightblue";
            document.getElementById("tp1").style.color = "blue";
            document.getElementById("tp1").innerHTML = "Вы нажали на вторую кнопку";
        }
        function func3() {
            document.getElementById("tp1").style.backgroundColor = "lightgreen";
            document.getElementById("tp1").style.color = "blue";
            document.getElementById("tp1").innerHTML = "Вы нажали на третью кнопку";
        }
    </script>
</head>
<body style="background-color: green;">
    <p id="tp1" style="color:yellow; width: 8cm;">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()" style="background-color: pink;">
        <input type="button" value="Вторая" onclick="func2()" style="background-color: lightblue;">
        <input type="button" value="Третья" onclick="func3()" style="background-color: lightgreen;">
    </form>
</body>
</html>
