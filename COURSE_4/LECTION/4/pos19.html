<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 19</title>
    <script>
        function func1() {
            document.getElementById("p1").style.color = "red";
        }
        function func2() {
            document.getElementById("p1").style.color = "black";
            document.getElementById("p1").style.backgroundColor = "white";
        }
        function func3() {
            document.getElementById("p1").style.color = "yellow";
            document.getElementById("p1").style.backgroundColor = "";
        }
    </script>
</head>

<body style="background-color: green;">
    <p id="p1" style="color:yellow">Пример использования формы с кнопками</p>
    <form>
        <input type="button" value="Первая" onclick="func1()">
        <input type="button" value="Вторая" onclick="func2()">
        <input type="button" value="Третья" onclick="func3()">
    </form>
</body>

</html>
