<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Объект Navigator</title>
</head>

<body>
    <h3>Свойства и метод объекта navigator (только для чтения):</h3>
    <script>
        document.write("Имя браузера (appName): " + navigator.appName + "<br>");
        document.write("Платформа компьютера (platform): " + navigator.platform + "<br>");
        document.write("Поддержка Java (javaEnabled): " + navigator.javaEnabled() + "<br>");
    </script>
</body>

</html>
