<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Объект History</title>
</head>

<body>
    <h3>1. Свойство объекта history:</h3>
    <script>
        document.write("Количество страниц в истории сеанса (length): " + history.length + "<br>");
    </script>

    <h3>2. Метод объекта history:</h3>
    <button onclick="history.back()">Шаг назад на предыдущую страницу (back)</button>
</body>

</html>
