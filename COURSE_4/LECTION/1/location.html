<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Объект Location</title>
</head>

<body>
    <h3>1. Свойства объекта location:</h3>
    <script>
        document.write("Полный адрес страницы (href): " + location.href + "<br>");
        document.write("Имя хоста (hostname): " + location.hostname + "<br>");
    </script>

    <h3>2. Метод объекта location:</h3>
    <button onclick="location.reload()">Перезагрузить страницу (reload)</button>
</body>

</html>
