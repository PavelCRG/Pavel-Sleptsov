<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пример 23/2</title>
    <script>
        var n = 0; // номер отображаемого источника
        var pic = ["image/sun.png", "image/moon.png"]; // массив путей к файлам

        function func2() {
            n = (n + 1) % 2; // циклическое изменение n между 0 и 1
            document.getElementById("rr1").src = pic[n];
        }
    </script>
</head>

<body style="background-color: blue;">
    <!-- Структура HTML остается такой же -->
    <img id="rr1" src="image/sun.png" style="height:150px" onclick="func2()">
    
    <p style="color:yellow"></p>
</body>

</html>
