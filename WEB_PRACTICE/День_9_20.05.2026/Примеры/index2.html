<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid p-0">

        <!-- Top Row: 6 equal columns -->
        <div class="row g-0 bg-primary-subtle border-bottom border-dark">
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
            <div class="col-2 p-2">
                <div class="bg-danger border border-dark" style="height: 40px;"></div>
            </div>
        </div>

        <!-- Middle Row: 3 columns -->
        <div class="row g-0 bg-success-subtle border-bottom border-dark">

            <!-- Left sidebar: 3 blocks -->
            <div class="col-lg-3 col-md-4 p-2 border-end border-dark">
                <div class="bg-danger border border-dark mb-2" style="height: 35px;"></div>
                <div class="bg-danger border border-dark mb-2" style="height: 35px;"></div>
                <div class="bg-danger border border-dark" style="height: 35px;"></div>
            </div>

            <!-- Center content -->
            <div class="col-lg-6 col-md-4 p-2">
                <div class="bg-primary-subtle border border-dark p-2">
                    <!-- 4 small blocks on top -->
                    <div class="row g-0 mb-2">
                        <div class="col-3 p-1">
                            <div class="bg-danger border border-dark" style="height: 35px;"></div>
                        </div>
                        <div class="col-3 p-1">
                            <div class="bg-danger border border-dark" style="height: 35px;"></div>
                        </div>
                        <div class="col-3 p-1">
                            <div class="bg-danger border border-dark" style="height: 35px;"></div>
                        </div>
                        <div class="col-3 p-1">
                            <div class="bg-danger border border-dark" style="height: 35px;"></div>
                        </div>
                    </div>
                    <!-- Large empty area -->
                    <div class="bg-primary-subtle" style="height: 180px;"></div>
                </div>
            </div>

            <!-- Right sidebar: 2 blocks -->
            <div class="col-lg-3 col-md-4 p-2 border-start border-dark">
                <div class="bg-danger border border-dark mb-2" style="height: 100px;"></div>
                <div class="bg-danger border border-dark" style="height: 100px;"></div>
            </div>
        </div>

        <!-- Bottom Row: 3 equal columns -->
        <div class="row g-0 bg-primary-subtle">
            <div class="col-4 p-2">
                <div class="bg-danger border border-dark" style="height: 70px;"></div>
            </div>
            <div class="col-4 p-2">
                <div class="bg-danger border border-dark" style="height: 70px;"></div>
            </div>
            <div class="col-4 p-2">
                <div class="bg-danger border border-dark" style="height: 70px;"></div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
