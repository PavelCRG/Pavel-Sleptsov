<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Внутренняя таблица стилей</title>
    <style>
        .redtext {
            color: #FF0000;
        }

        #bigtext {
            font-size: large;
        }

        EM {
            color: #00FF00;
            font-weight: bold;
        }

        P EM {
            color: #0000FF;
        }
    </style>
</head>

<body>
    <p class="redtext">Красный текст</p>
    <p id="bigtext">Большой текст</p>
    <em>Зеленый жирный текст</em>
    <p><em>Синий текст внутри абзаца</em></p>
</body>

</html>
