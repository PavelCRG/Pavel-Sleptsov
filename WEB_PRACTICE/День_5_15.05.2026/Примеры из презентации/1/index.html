<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Пример 1 - Переопределение тега</title>
    <style>
        P {
            color: #0000FF;
        }

        EM {
            color: #00FF00;
            font-weight: bold;
        }

        BODY {
            background-color: #000000;
            color: #FFFFFF;
        }
    </style>
</head>

<body>
    <p>Текст параграфа</p>
    <em>EM текст</em>
</body>

</html>
