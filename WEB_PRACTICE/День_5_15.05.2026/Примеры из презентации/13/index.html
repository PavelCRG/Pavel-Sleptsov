<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Приоритеты выполнения стиля</title>
    <link rel="stylesheet" href="styles1.css" type="text/css">
    <style>
        .redtext {
            color: #0000FF;
        }

        EM {
            font-size: smaller;
        }
    </style> 
</head>

<body>
    <p class="redtext">Это красный текст.</p>
    <p id="bigtext" style="color: #FFFF00;">Это большой текст.</p>
    <p><em>Это курсив.</em></p>
</body>

</html>
