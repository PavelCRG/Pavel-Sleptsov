<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Несколько таблиц стилей</title>
    <link rel="stylesheet" href="styles1.css" type="text/css" media="screen">
    <link rel="stylesheet" href="styles2.css" type="text/css" media="print">
    <style>
        .redtext {
            color: #0000FF;
        }

        EM {
            font-size: smaller;
        }
    </style>
</head>

<body>
    <p class="redtext">Это красный текст (но во внутреннем стиле синий)</p>
    <p id="bigtext">Это большой текст</p>
    <em>Это курсив (зеленый жирный из styles1.css + smaller из внутреннего)</em>
    <p><em>Это вложенный em (синий из styles1.css)</em></p>
</body>

</html>
