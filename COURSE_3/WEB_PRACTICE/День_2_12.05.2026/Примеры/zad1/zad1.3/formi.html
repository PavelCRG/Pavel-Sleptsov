<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формы</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin: 0;
            padding: 20px;
        }

        #container {
            margin: auto;
            width: 80%;
            height: 100%;
        }

        #header {
            border: 5px solid orange;
            width: 100%;
            height: 80px;
            margin-bottom: 5px;
            text-align: center;
            line-height: 80px;
            background: white;
        }

        #sidebar {
            border: 5px solid red;
            float: left;
            width: 20%;
            min-height: 400px;
            margin-right: 20px;
            padding: 10px;
            background: white;
        }

        #sidebar ul {
            padding-left: 20px;
        }

        #sidebar li {
            margin: 5px 0;
        }

        #sidebar a {
            text-decoration: none;
            color: black;
        }

        #content {
            border: 5px solid green;
            margin-left: 22%;
            min-height: 400px;
            padding: 15px;
            background: #ffccff;
            overflow: auto;
        }

        input,
        select,
        textarea {
            margin: 5px;
            padding: 5px;
        }

        #footer {
            border: 5px solid aqua;
            width: 100%;
            height: 50px;
            margin-top: 5px;
            text-align: center;
            line-height: 50px;
            clear: both;
            background: white;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="header"> header (шапка сайта) </div>

        <div id="sidebar">
            <h3>левая панель</h3>
            <ul>
                <li><a href="zad1.3.html">Главная</a></li>
                <li><a href="spiski.html">Списки</a></li>
                <li><a href="ssilki.html">Ссылки</a></li>
                <li><a href="tablitsi.html">Таблицы</a></li>
                <li><a href="formi.html">Формы</a></li>
                <li><a href="formatirovanie.html">Форматирование</a></li>
            </ul>
        </div>

        <div id="content">
            <center>
                <font size=7 color=green> ФОРМЫ</font>
            </center>
            <hr align=center size=6 color=orange>
            <center>
                <font color=red>
                    <h3> ФОРМА РЕГИСТРАЦИИ </h3>
                </font>
            </center>
            <form action="#" method="post">
                <label>Имя:</label><br>
                <input type="text" name="name" placeholder="Введите ваше имя"><br><br>

                <label>Email:</label><br>
                <input type="email" name="email" placeholder="Введите email"><br><br>

                <label>Возраст:</label><br>
                <input type="number" name="age" placeholder="Ваш возраст"><br><br>

                <label>Пол:</label><br>
                <input type="radio" name="gender" value="male"> Мужской
                <input type="radio" name="gender" value="female"> Женский<br><br>

                <label>Город (Беларусь):</label><br>
                <select name="city">
                    <option>Минск</option>
                    <option>Гомель</option>
                    <option>Витебск</option>
                    <option>Могилев</option>
                    <option>Гродно</option>
                    <option>Брест</option>
                </select><br><br>

                <label>Комментарий:</label><br>
                <textarea rows="4" cols="40" placeholder="Ваш комментарий"></textarea><br><br>

                <input type="reset" value="Очистить">
            </form>
            <hr>
        </div>

        <div id="footer"> footer (подвал) &copy; Слепцов Павел Леонидович </div>
    </div>
</body>

</html>
