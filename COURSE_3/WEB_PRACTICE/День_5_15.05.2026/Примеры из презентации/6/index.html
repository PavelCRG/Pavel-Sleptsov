    <title>Комбинированные стили</title>

        .menu {
            color: red;
        }

            color: green;
        }

            color: blue;
        }
    </style>
</head>

    <ul class="menu">
        <li><a href="#">Item 01</a></li>
        <li><a href="#">Item 02</a></li>
        <li><a href="#">Item 03</a></li>
    </ul>
</body>
</html>
