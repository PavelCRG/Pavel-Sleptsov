<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Форма 5 — Отзыв</title>
</head>

<body>
    <b>Отзыв:</b><br><br>
    <form name="review_form" method="post" action="review.php">
        <fieldset>
            <legend>Оставьте Ваш отзыв</legend>
            <input type="text" id="review_name" name="name" required>*
            <label for="review_name">Имя</label><br>
            <input type="email" id="review_email" name="email" required>*
            <label for="review_email">e-mail</label><br>
            Форма отправки<br>
            <textarea name="message" rows="4" cols="28"></textarea><br>
            <input type="submit" value="Отправить">
        </fieldset>
    </form>
</body>

</html>
