<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .item {
            height: 50px;
            background-color: red;
            margin-bottom: 10px;
        }

        .carousel-item>img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .carousel-indicators [data-bs-target] {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        body {
            background-color: #f5f5f5;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            margin: 10px;
        }
    </style>
    <title>Красивые города мира</title>
</head>

<body>

    <div id="snow"></div>

    <!-- Carousel с городами -->
    <div id="carouselExampleIndicators" class="carousel slide carousel-fade">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/paris.jpg" class="d-block w-100" alt="Париж">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Париж, Франция</h5>
                    <p>Эйфелева башня — символ любви и романтики</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="images/york.jpg" class="d-block w-100" alt="Нью-Йорк">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Нью-Йорк, США</h5>
                    <p>Город, который никогда не спит</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="images/Colosseo1_cr.jpg" class="d-block w-100" alt="Рим">
                <div class="carousel-caption d-none d-md-block">
                    <h5>Рим, Италия</h5>
                    <p>Вечный город с богатой историей</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>

    <!-- Layout -->
    <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-8">
                <div class="item"></div>
            </div>
            <div class="col-lg-6 col-md-4">
                <div class="item">
                    <button type="button" class="btn btn-primary">Primary</button>
                </div>
            </div>
            <div class="col-lg-3">
                <div class="item">
                    <div class="alert alert-success" role="alert">
                        A simple success alert—check it out!
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="item"></div>
            </div>
            <div class="col-lg-3">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
            <div class="col-lg-1 col-md-4">
                <div class="item"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div style="text-align: center; margin: 20px;">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Launch demo modal
        </button>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <h4>Добро пожаловать!</h4>
                    <p>Это красивое модальное окно</p>
                </div>
            </div>
        </div>
    </div>

  
    <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js"></script>
    <script type="text/javascript" src="snow/snow.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
