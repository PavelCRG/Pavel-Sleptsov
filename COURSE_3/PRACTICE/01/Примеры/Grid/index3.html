<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display: grid; border: solid red 1px;
            grid-template-columns: 100px repeat(2, 50px 1fr); grid-template-rows: 30px  20px">
        <div style="background-color: magenta">AAA</div>
        <div style="background-color: cyan">BBB</div>
        <div style="background-color: silver">CCC</div>
        <div style="background-color: yellow">DDD</div>
        <div style="background-color: red">EEE</div>
        <div style="background-color: green">FFF</div>
        <div style="background-color: gray">GGG</div>
        </div>
</body>
</html>
