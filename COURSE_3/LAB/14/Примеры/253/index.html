<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея — пример 253</title>
</head>

<body>
    <center>
        <img id="pict" src="paris.jpg" height="200" alt="">
        <br><br>
        <input type="button" onclick="l_image()" value="←">
        <input type="button" onclick="r_image()" value="→">
    </center>
    <script>
        var arr = ["Colosseo1_cr.jpg", "paris.jpg", "york.jpg"];
        var n = 1;
        var pict = document.getElementById("pict");

        function showImage() {
            if (pict) {
                pict.src = arr[n];
            }
        }

        function r_image() {
            n = (n + 1) % arr.length;
            showImage();
        }

        function l_image() {
            n = (n - 1 + arr.length) % arr.length;
            showImage();
        }

        showImage();
    </script>
</body>

</html>
